<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Prefer Victor Mono for generic families. -->
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>VictorMono Nerd Font</family></prefer>
  </alias>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>VictorMono Nerd Font</family></prefer>
  </alias>
  <alias binding="strong">
    <family>serif</family>
    <prefer><family>VictorMono Nerd Font</family></prefer>
  </alias>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>VictorMono Nerd Font</family></prefer>
  </alias>

  <!-- Remap common app/UI families (Chrome/Slack/Electron fallbacks). -->
  <match target="pattern">
    <test name="family"><string>Lato</string></test>
    <edit name="family" mode="assign" binding="strong"><string>VictorMono Nerd Font</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Slack-Lato</string></test>
    <edit name="family" mode="assign" binding="strong"><string>VictorMono Nerd Font</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Roboto</string></test>
    <edit name="family" mode="assign" binding="strong"><string>VictorMono Nerd Font</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Google Sans</string></test>
    <edit name="family" mode="assign" binding="strong"><string>VictorMono Nerd Font</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Cantarell</string></test>
    <edit name="family" mode="assign" binding="strong"><string>VictorMono Nerd Font</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Noto Sans</string></test>
    <edit name="family" mode="assign" binding="strong"><string>VictorMono Nerd Font</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>DejaVu Sans</string></test>
    <edit name="family" mode="assign" binding="strong"><string>VictorMono Nerd Font</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Adwaita Sans</string></test>
    <edit name="family" mode="assign" binding="strong"><string>VictorMono Nerd Font</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Adwaita Mono</string></test>
    <edit name="family" mode="assign" binding="strong"><string>VictorMono Nerd Font</string></edit>
  </match>
</fontconfig>
